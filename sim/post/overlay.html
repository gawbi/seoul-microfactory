<!doctype html><html><head><meta charset="utf-8"><style>
/* 사이트와 같은 말투와 글꼴: Pretendard + Archivo Expanded, 가격표 노랑은 표시용으로만 */
@font-face{font-family:P;src:url(file:///home/ga/seoul/node_modules/pretendard/dist/web/variable/woff2/PretendardVariable.woff2)}
@font-face{font-family:A;src:url(file:///home/ga/seoul/node_modules/@fontsource-variable/archivo/files/archivo-latin-wdth-normal.woff2);font-stretch:62% 125%}
*{margin:0;box-sizing:border-box}
html,body{width:1600px;height:900px;background:transparent;overflow:hidden;font-family:P;color:#e9ebe6;word-break:keep-all}
.grad{position:absolute;left:0;right:0;bottom:0;height:340px;background:linear-gradient(180deg,rgba(12,14,16,0),rgba(12,14,16,.8))}
.gradt{position:absolute;left:0;right:0;top:0;height:120px;background:linear-gradient(0deg,rgba(12,14,16,0),rgba(12,14,16,.45))}
.top{position:absolute;left:56px;right:56px;top:44px;display:flex;justify-content:space-between;align-items:center}
.mark{font:860 15px A;font-stretch:125%;letter-spacing:-.01em;color:#e9ebe6}
.tag{padding:6px 12px;font-size:15px;font-weight:700;color:#1d2125;background:#f3c21b}
.low{position:absolute;left:56px;bottom:52px;max-width:900px}
.step{font-size:17px;font-weight:650;color:#a3aaa9;margin-bottom:12px}
.step b{color:#e9ebe6;font-weight:700;margin-right:10px}
h1{font-weight:760;font-size:50px;letter-spacing:-.035em;line-height:1.15;color:#fff}
p{margin-top:14px;font-size:22px;line-height:1.55;color:#d6d9d4;font-weight:500;max-width:30em}
.facts{position:absolute;right:56px;bottom:56px;display:flex;flex-direction:column;align-items:flex-end;gap:8px}
.fact{display:flex;align-items:center;gap:10px;font-size:16px;font-weight:600;color:#d6d9d4}
.fact i{width:10px;height:10px;border:1.5px solid #a3aaa9;display:block}
.fact.warn i{background:#f3c21b;border-color:#f3c21b}
</style></head><body>
<div class="gradt"></div><div class="grad"></div>
<div class="top"><div class="mark">SEOUL MICROFACTORY</div><div class="tag">Isaac Sim 6.2 시뮬레이션</div></div>
<div class="low"><div class="step"><b id="no"></b><span id="sn"></span></div><h1 id="t"></h1><p id="c"></p></div>
<div class="facts" id="f"></div>
<script>
const q=new URLSearchParams(location.hash.slice(1));
no.textContent=q.get('no');sn.textContent=q.get('sn');t.textContent=q.get('t');c.textContent=q.get('c');
(q.get('facts')||'').split('|').filter(Boolean).forEach(s=>{const d=document.createElement('div');d.className='fact'+(s.startsWith('!')?' warn':'');d.innerHTML='<i></i>';d.append(s.replace(/^!/,''));f.appendChild(d)});
</script></body></html>
